<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4>Exam Management</h4>
        </div>

        <div class="card-body">

            <!-- Backend Validation -->
            <div class="alert alert-danger" *ngIf="errorMessage()">
                {{errorMessage()}}
            </div>

            <form [formGroup]="examForm" (ngSubmit)="saveExam()">

                <!-- Student -->

                <div class="mb-3">

                    <label class="form-label">Student</label>

                    <select class="form-control" formControlName="studentId">

                        <option value="">--Select Student--</option>

                        <option *ngFor="let student of students()" [value]="student.studentId">

                            {{student.studentName}}

                        </option>

                    </select>

                    <span class="text-danger" *ngIf="examForm.get('studentId')?.touched &&
                                 examForm.get('studentId')?.errors?.['required']">

                        Student is required.

                    </span>

                </div>

                <!-- Exam Year -->

                <div class="mb-3">

                    <label class="form-label">Exam Year</label>

                    <input type="number" class="form-control" formControlName="examYear">

                    <span class="text-danger" *ngIf="examForm.get('examYear')?.touched &&
                                 examForm.get('examYear')?.errors?.['required']">

                        Exam Year is required.

                    </span>

                    <span class="text-danger" *ngIf="examForm.get('examYear')?.errors?.['max']">

                        Future year is not allowed.

                    </span>

                </div>

                <hr>

                <h5>Subjects</h5>

                <div formArrayName="examDtls">

                    <div class="row fw-bold mb-2">

                        <div class="col-md-5">
                            Subject
                        </div>

                        <div class="col-md-3">
                            Marks
                        </div>

                        <div class="col-md-4">
                            Action
                        </div>

                    </div>

                    <div class="row mb-3" *ngFor="let item of examDtls.controls; let i=index" [formGroupName]="i">

                        <!-- Subject -->

                        <div class="col-md-5">

                            <select class="form-control" formControlName="subjectId">

                                <option value="">--Select Subject--</option>

                                <option *ngFor="let subject of availableSubjects(i)" [value]="subject.subjectId">

                                    {{subject.subjectName}}

                                </option>

                            </select>

                            <span class="text-danger" *ngIf="item.get('subjectId')?.touched &&
                                         item.get('subjectId')?.errors?.['required']">

                                Please select a subject.

                            </span>

                        </div>

                        <!-- Marks -->

                        <div class="col-md-3">

                            <input type="number" class="form-control" formControlName="marks" (keyup)="calculateTotal()"
                                (change)="calculateTotal()">

                            <span class="text-danger" *ngIf="item.get('marks')?.touched &&
                                         item.get('marks')?.errors?.['required']">

                                Marks are required.

                            </span>

                            <span class="text-danger" *ngIf="item.get('marks')?.errors?.['min']">

                                Minimum marks is 0.

                            </span>

                            <span class="text-danger" *ngIf="item.get('marks')?.errors?.['max']">

                                Maximum marks is 100.

                            </span>

                        </div>

                        <!-- Delete -->

                        <div class="col-md-4">

                            <button type="button" class="btn btn-danger" (click)="removeSubject(i)"
                                *ngIf="examDtls.length>1">

                                <i class="fa fa-trash"></i>

                            </button>

                        </div>

                    </div>

                </div>

                <!-- Add Subject -->

                <div class="mt-2">

                    <button type="button" class="btn btn-success" (click)="addSubject()">

                        <i class="fa fa-plus"></i>
                        Add Subject

                    </button>

                </div>

                <hr>

                <!-- Total -->

                <div class="row">

                    <div class="col-md-6">

                        <h5>

                            Total Marks :

                            <span class="text-primary">

                                {{totalMark()}}

                            </span>

                        </h5>

                    </div>

                    <div class="col-md-6">

                        <h5>

                            Result :

                            <span class="badge bg-success" *ngIf="passOrFail()=='PASS'">

                                PASS

                            </span>

                            <span class="badge bg-danger" *ngIf="passOrFail()=='FAIL'">

                                FAIL

                            </span>

                        </h5>

                    </div>

                </div>

                <hr>

                <!-- Buttons -->

                <button class="btn btn-primary me-2" type="submit" [disabled]="examForm.invalid">

                    Save Exam

                </button>

                <button type="button" class="btn btn-secondary" routerLink="/exam/list">

                    Cancel

                </button>

            </form>

        </div>

    </div>

</div>
